    e.preventDefault();
    var pw = $('pw').value; if (!pw) return;
    if (Date.now() < waitUntil) { showGate('Too many attempts. Try again in ' + Math.ceil((waitUntil - Date.now()) / 1000) + ' seconds.'); return; }
    $('go').disabled = true; $('go').textContent = 'Unlocking…'; $('err').style.display = 'none';
    var raw;
    derive(pw).then(function (r) { raw = r; return decrypt(r); })
      .then(function (html) { store.set(toB64(raw), $('rem').checked); open(html); })
      .catch(function () {
        fails++; if (fails >= 5) { waitUntil = Date.now() + 30000; fails = 0; }
        $('go').disabled = false; $('go').textContent = 'Unlock'; $('pw').select();
        showGate(Date.now() < waitUntil ? 'Too many attempts. Try again in 30 seconds.' : 'That password is not correct.');
      });
  };
  var saved = store.get();
  if (saved) decrypt(fromB64(saved)).then(open).catch(function () { store.clear(); showGate(); });
  else showGate();
})();
</script>
</body>
</html>
