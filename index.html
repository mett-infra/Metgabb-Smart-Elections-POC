  <div class="grid g-4 mb-16">${kpi('Registered', vols.length, 'users', CH.blue)}${kpi('Active', vols.filter(x => x.active).length, 'check', CH.green)}${kpi('In groups', new Set(Store.t('volunteer_group_members').map(m => m.volunteer_id)).size, 'group', CH.teal)}${kpi('Updates this week', Store.t('task_updates').filter(u => u.volunteer_id && Date.now() - new Date(u.created_at) < 7 * 864e5).length, 'camera', CH.violet)}</div>
  <div class="card"><div class="card-head"><div class="filters"><div class="search">${ic('search')}<input class="input" id="q" placeholder="Search name, email, phone" value="${esc(f.q || '')}"></div>${sel('con', conOptions(), f.con, 'id="fc"', 'All constituencies')}${sel('status', [['true', 'Active'], ['false', 'Inactive']], f.status, 'id="fst"', 'Any status')}</div><div class="spacer"></div><span class="small muted">${rows.length} volunteers</span></div>
  <div class="table-wrap"><table class="tbl"><thead><tr><th>Volunteer</th><th>Contact</th><th>Constituency</th><th>Groups</th><th>Task completion</th><th>Last activity</th><th>Active</th><th></th></tr></thead><tbody>${rows.map(x => { const s = stat(x); const gs = Store.t('volunteer_group_members').filter(m => m.volunteer_id === x.id).map(m => Store.find('volunteer_groups', m.group_id)); return `<tr class="click" data-open="${x.id}"><td><div class="row">${avatar(x.name, { size: 'sm' })}<div><div class="b">${esc(x.name)}</div><div class="tiny muted">${esc(x.skills.join(', '))}</div></div></div></td><td class="small">${esc(x.email)}<div class="muted">${esc(x.phone)}</div></td><td class="small">${esc(geo.conName(x.constituency_id))}</td><td>${gs.map(g => `<span class="badge b-teal">${esc(g.name.split(' ').slice(0, 2).join(' '))}${g.leader_id === x.id ? ' ★' : ''}</span>`).join(' ') || '<span class="muted small">—</span>'}</td><td style="min-width:120px"><div class="row gap-6"><div class="prog" style="flex:1"><div style="width:${s.total ? s.done / s.total * 100 : 0}%"></div></div><span class="tiny muted">${s.done}/${s.total}</span></div></td><td class="small muted">${s.last ? fmt.ago(s.last) : 'No activity'}</td><td><button class="switch ${x.active ? 'on' : ''}" data-toggle="${x.id}"></button></td><td><button class="btn xs" data-edit="${x.id}">${ic('edit')}</button></td></tr>`; }).join('') || `<tr><td colspan="8">${emptyState('No volunteers found')}</td></tr>`}</tbody></table></div></div>`);
  $('#q', v).oninput = (e) => { UIS.vol.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(() => { refresh(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); };
  $('#fc', v).onchange = e => { UIS.vol.con = e.target.value; refresh(); }; $('#fst', v).onchange = e => { UIS.vol.status = e.target.value; refresh(); };
  $('#newV', v).onclick = () => volunteerForm();
  $('#exp', v).onclick = () => downloadText(toCSV(rows.map(x => { const s = stat(x); return { name: x.name, email: x.email, phone: x.phone, constituency: geo.conName(x.constituency_id), active: x.active, tasks_total: s.total, tasks_completed: s.done, updates: s.ups }; })), 'volunteers.csv');
  $$('[data-open]', v).forEach(r => r.onclick = (e) => { if (e.target.closest('button')) return; volunteerDrawer(r.dataset.open); });
  $$('[data-edit]', v).forEach(b => b.onclick = () => volunteerForm(Store.find('volunteers', b.dataset.edit)));
  $$('[data-toggle]', v).forEach(b => b.onclick = () => { API.admin.toggleVolunteer(b.dataset.toggle); toast('Volunteer status updated. Deactivated volunteers cannot sign in.'); refresh(); });
}
function volunteerForm(x) {
  modal({ title: x ? `Edit ${esc(x.name)}` : 'Register volunteer', body: `<form class="grid g-2" id="vf">${field('Full name', inp('name', x?.name))}${field('Email (login)', inp('email', x?.email, 'type="email"'))}${field('Phone', inp('phone', x?.phone, 'placeholder="+60 12-345 6789"'))}${field('Constituency', sel('constituency_id', conOptions(true), x?.constituency_id, '', 'Select constituency'), x ? 'Changing this removes them from groups in other constituencies.' : '')}${field('Availability', sel('availability', ['Weekends', 'Evenings', 'Weekdays', 'Flexible'], x?.availability))}${field('Skills', inp('skills', x?.skills?.join(', '), 'placeholder="Door-to-door, Photography"'), 'Comma separated')}</form>`, foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="sv">${x ? 'Save' : 'Register'}</button>`, onMount: (r, close) => {
    $('#sv', r).onclick = () => { try { const res = API.admin.saveVolunteer({ ...formData($('#vf', r)), id: x?.id }); close(); refresh(); if (res.removed.length) toast(`Constituency changed. Removed from: ${esc(res.removed.join(', '))}`); else toast(x ? 'Volunteer updated' : 'Volunteer registered'); if (res.tempPw) modal({ title: 'Volunteer account created', size: 'narrow', body: `<div class="callout ok">${ic('check')}<div><b>${esc(res.v.name)}</b> can now sign in to the Volunteer Portal.</div></div><dl class="kv mt-16"><dt>Login</dt><dd class="mono">${esc(res.v.email)}</dd><dt>One-time password</dt><dd class="mono">${esc(res.tempPw)}</dd></dl>`, foot: '<button class="btn primary" data-close>Done</button>' }); } catch (e) { handleErr(e, $('#vf', r)); } };
  } });
}
function volunteerDrawer(id) {
  const x = Store.find('volunteers', id); const ids = volTaskIds(id); const ts = Store.t('tasks').filter(t => ids.has(t.id));
  const ups = Store.t('task_updates').filter(u => u.volunteer_id === id).sort((a, b) => b.created_at.localeCompare(a.created_at));
  const gs = Store.t('volunteer_group_members').filter(m => m.volunteer_id === id).map(m => Store.find('volunteer_groups', m.group_id));
  modal({ drawer: true, title: esc(x.name), sub: `${esc(geo.conName(x.constituency_id))} · ${x.active ? 'Active' : 'Inactive'}`, body: `<div class="row mb-16">${avatar(x.name, { size: 'lg' })}<div><div class="small">${ic('mail').replace('class="ic ', 'style="width:13px;height:13px;vertical-align:-2px" class="ic ')} ${esc(x.email)}</div><div class="small mt-4">${ic('phone').replace('class="ic ', 'style="width:13px;height:13px;vertical-align:-2px" class="ic ')} ${esc(x.phone)}</div><div class="tiny muted mt-4">Joined ${fmt.date(x.joined_at)} · ${esc(x.availability)}</div></div></div>
    <div class="grid g-3">${[['Assigned', ts.length], ['Completed', ts.filter(t => t.status === 'Completed').length], ['Updates', ups.length]].map(([l, n]) => `<div class="card" style="padding:12px;text-align:center"><div class="b" style="font-size:20px">${n}</div><div class="tiny muted">${l}</div></div>`).join('')}</div>
    <h4 class="mt-16 mb-8">Groups</h4>${gs.map(g => `<span class="badge b-teal">${esc(g.name)}${g.leader_id === id ? ' · Leader' : ''}</span>`).join(' ') || '<span class="small muted">Not in a group</span>'}
    <h4 class="mt-16 mb-8">Tasks</h4>${ts.map(t => `<div class="row small mb-8" style="cursor:pointer" data-task="${t.id}">${badge(t.status)}<span style="flex:1">${esc(t.title)}</span><span class="muted tiny">${t.group_id ? 'via group' : 'direct'}</span></div>`).join('') || '<p class="small muted">No tasks</p>'}
    <h4 class="mt-16 mb-8">Activity</h4><div class="timeline">${ups.slice(0, 10).map(u => `<div class="tl-item"><div class="tl-dot">${ic(u.status_to ? 'check' : 'msg')}</div><div class="tl-body small"><b>${esc(Store.find('tasks', u.task_id)?.title || 'Task')}</b>${u.status_to ? ` → ${badge(u.status_to)}` : ''}<div class="muted">${esc(u.comment)}</div><div class="tiny muted">${fmt.dt(u.created_at)}</div></div></div>`).join('') || '<p class="small muted">No activity yet</p>'}</div>`, onMount: (r, close) => $$('[data-task]', r).forEach(el => el.onclick = () => { close(); taskDrawer(el.dataset.task); }) });
}

  <div class="grid g-3">${gs.map(g => { const mem = Store.t('volunteer_group_members').filter(m => m.group_id === g.id).map(m => Store.find('volunteers', m.volunteer_id)).filter(Boolean); const ts = Store.t('tasks').filter(t => t.group_id === g.id); const d = ts.filter(t => t.status === 'Completed').length; const leader = g.leader_id && Store.find('volunteers', g.leader_id); return `<div class="card card-pad"><div class="row"><div class="kic" style="width:38px;height:38px;border-radius:11px;background:var(--teal-50);color:var(--teal);display:grid;place-items:center">${ic('group')}</div><div style="flex:1;min-width:0"><div class="b">${esc(g.name)}</div><div class="small muted">${esc(geo.conName(g.constituency_id))}</div></div></div><p class="small muted mt-12" style="min-height:54px">${esc(g.description || '')}</p><div class="row mt-12"><div class="stack">${mem.slice(0, 6).map(m => avatar(m.name, { size: 'sm' })).join('')}</div><span class="small muted">${mem.length} members</span></div><div class="small mt-8">Leader: <b>${leader ? esc(leader.name) : '<span class="muted">Not set</span>'}</b></div><div class="row gap-6 mt-12"><div class="prog" style="flex:1"><div style="width:${ts.length ? d / ts.length * 100 : 0}%"></div></div><span class="tiny muted">${d}/${ts.length} tasks</span></div><div class="row mt-16 gap-6"><button class="btn sm primary" data-manage="${g.id}">Manage</button><button class="btn sm" data-assign="${g.id}">${ic('task')}Assign task</button><span class="spacer"></span><button class="btn sm ghost" data-edit="${g.id}">${ic('edit')}</button></div></div>`; }).join('')}</div>`);

  $$('[data-assign]', v).forEach(b => b.onclick = () => { const g = Store.find('volunteer_groups', b.dataset.assign); taskForm({ constituency_id: g.constituency_id, group_id: g.id }); });
}
function groupForm(g) {
  modal({ title: g ? 'Edit group' : 'New volunteer group', body: `<form class="col" id="gf">${field('Group name', inp('name', g?.name, 'placeholder="e.g. Damansara Ground Operations"'))}${field('Constituency', sel('constituency_id', conOptions(true), g?.constituency_id, '', 'Select constituency'))}${field('Description', txt('description', g?.description, 'rows="3"'))}</form>`, foot: `${g ? '<button class="btn danger" id="del" style="margin-right:auto">Delete group</button>' : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="sv">Save</button>`, onMount: (r, close) => {
    $('#sv', r).onclick = () => { try { API.admin.saveGroup({ ...formData($('#gf', r)), id: g?.id }); close(); toast('Group saved'); refresh(); } catch (e) { handleErr(e, $('#gf', r)); } };
    if (g) $('#del', r).onclick = async () => { if (await confirmDlg('Delete group?', 'Members are released and tasks assigned to this group become unassigned from it.', 'Delete')) { API.admin.deleteGroup(g.id); close(); toast('Group deleted'); refresh(); } };
  } });
}
function groupDrawer(gid) {
  const g = Store.find('volunteer_groups', gid);
  const mem = Store.t('volunteer_group_members').filter(m => m.group_id === gid).map(m => Store.find('volunteers', m.volunteer_id)).filter(Boolean);
  const eligible = Store.t('volunteers').filter(x => x.active && x.constituency_id === g.constituency_id && !mem.some(m => m.id === x.id));
  const others = Store.t('volunteers').filter(x => x.constituency_id !== g.constituency_id).slice(0, 4);
  const ts = Store.t('tasks').filter(t => t.group_id === gid);
  const m = modal({ drawer: true, title: esc(g.name), sub: esc(geo.conName(g.constituency_id)), body: `
    <h4 class="mb-8">Members (${mem.length})</h4>
    ${mem.map(x => `<div class="row mb-8" style="padding:8px;border:1px solid var(--line);border-radius:10px">${avatar(x.name, { size: 'sm' })}<div style="flex:1"><div class="b small">${esc(x.name)} ${g.leader_id === x.id ? '<span class="badge b-amber">★ Leader</span>' : ''}</div><div class="tiny muted">${esc(x.phone)}</div></div>${g.leader_id !== x.id ? `<button class="btn xs" data-lead="${x.id}">Make leader</button>` : ''}<button class="btn xs danger" data-rm="${x.id}">Remove</button></div>`).join('') || '<p class="small muted">No members yet</p>'}
    <div class="divider"></div><h4 class="mb-8">Add members</h4>
    <div class="row">${sel('add', eligible.map(x => [x.id, x.name]), '', 'id="addSel"', eligible.length ? 'Select a volunteer from ' + geo.conName(g.constituency_id) : 'No eligible volunteers left')}<button class="btn primary" id="addBtn" ${eligible.length ? '' : 'disabled'}>Add</button></div>
    <div class="callout warn mt-12">${ic('shield')}<div>Only volunteers assigned to <b>${esc(geo.conName(g.constituency_id))}</b> can join. Try adding someone else to see the rule enforced: ${others.map(o => `<button class="btn xs" data-try="${o.id}" style="margin:2px">${esc(o.name)} (${esc(geo.conName(o.constituency_id))})</button>`).join('')}</div></div>
    <div class="divider"></div><div class="row mb-8"><h4>Group tasks (${ts.length})</h4><span class="spacer"></span><button class="btn sm" id="nt">${ic('plus')}Assign task to group</button></div>
    ${ts.map(t => `<div class="row small mb-8" data-task="${t.id}" style="cursor:pointer">${badge(t.status)}<span style="flex:1">${esc(t.title)}</span><span class="tiny muted">${fmt.due(t.due_date)}</span></div>`).join('') || '<p class="small muted">No tasks yet</p>'}`, onMount: (r, close) => {
      const reopen = () => { close(); refresh(); groupDrawer(gid); };
      $('#addBtn', r).onclick = () => { const val = $('#addSel', r).value; if (!val) return; try { API.admin.addMember(gid, val); toast('Member added'); reopen(); } catch (e) { handleErr(e); } };
      $$('[data-try]', r).forEach(b => b.onclick = () => { try { API.admin.addMember(gid, b.dataset.try); reopen(); } catch (e) { handleErr(e); } });
      $$('[data-rm]', r).forEach(b => b.onclick = () => { API.admin.removeMember(gid, b.dataset.rm); toast('Member removed'); reopen(); });
      $$('[data-lead]', r).forEach(b => b.onclick = () => { API.admin.setLeader(gid, b.dataset.lead); toast('Group leader assigned'); reopen(); });
      $('#nt', r).onclick = () => { close(); taskForm({ constituency_id: g.constituency_id, group_id: g.id }); };
      $$('[data-task]', r).forEach(el => el.onclick = () => { close(); taskDrawer(el.dataset.task); });
    } });
}

  const g = t.group_id && Store.find('volunteer_groups', t.group_id); const vs = taskAssignees(t).map(id => Store.find('volunteers', id)).filter(Boolean);
  return `${g ? `<span class="badge b-teal">${ic('group').replace('class="ic ', 'style="width:11px;height:11px" class="ic ')} ${esc(g.name)}</span>` : ''}${vs.length ? `<span class="stack" style="display:inline-flex;vertical-align:middle;margin-left:4px">${vs.slice(0, 3).map(x => avatar(x.name, { size: 'sm' }).replace('class="av sm"', `class="av sm" data-tip="${esc(x.name)}"`)).join('')}</span>` : ''}`;
}
function adminTasks() {
  const f = UIS.task; const all = Store.t('tasks');
  const rows = all.filter(t => (!f.con || t.constituency_id === f.con) && (!f.status || t.status === f.status) && (!f.pri || t.priority === f.pri) && (!f.q || (t.title + t.description).toLowerCase().includes(f.q.toLowerCase())));
  const updCount = (t) => Store.t('task_updates').filter(u => u.task_id === t.id && u.author_role === 'volunteer').length;
  const attCount = (t) => Store.t('task_attachments').filter(a => a.task_id === t.id && a.update_id).length;
  const kcard = (t) => `<div class="kcard" draggable="true" data-task="${t.id}"><div class="row" style="align-items:flex-start"><div class="b small" style="flex:1">${esc(t.title)}</div>${badge(t.priority)}</div><div class="tiny muted mt-4">${ic('pin').replace('class="ic ', 'style="width:11px;height:11px;vertical-align:-1px" class="ic ')} ${esc(geo.conName(t.constituency_id))}</div><div class="mt-8">${taskAssigneeHTML(t)}</div><div class="row tiny muted mt-8"><span>${fmt.due(t.due_date)}</span><span class="spacer"></span>${updCount(t) ? `<span data-tip="Volunteer updates">${ic('msg').replace('class="ic ', 'style="width:12px;height:12px;vertical-align:-2px" class="ic ')} ${updCount(t)}</span>` : ''}${attCount(t) ? `<span data-tip="Photos/videos from the field">${ic('camera').replace('class="ic ', 'style="width:12px;height:12px;vertical-align:-2px" class="ic ')} ${attCount(t)}</span>` : ''}</div></div>`;
  const board = `<div class="kanban">${STATUSES.map((s, i) => `<div class="kcol" data-col="${s}"><div class="kcol-head"><span class="badge ${STATUS_B[s]}"><span class="dot"></span>${s}</span><span class="muted small">${rows.filter(t => t.status === s).length}</span></div>${rows.filter(t => t.status === s).map(kcard).join('') || '<div class="tiny muted" style="padding:8px">Drop tasks here</div>'}</div>`).join('')}</div>`;
  const list = `<div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>Task</th><th>Constituency</th><th>Assigned to</th><th>Priority</th><th>Due</th><th>Status</th><th>Updates</th></tr></thead><tbody>${rows.map(t => `<tr class="click" data-task="${t.id}"><td class="b">${esc(t.title)}</td><td class="small">${esc(geo.conName(t.constituency_id))}</td><td>${taskAssigneeHTML(t)}</td><td>${badge(t.priority)}</td><td class="small">${fmt.date(t.due_date)}<div class="tiny">${fmt.due(t.due_date)}</div></td><td>${badge(t.status)}</td><td class="small">${updCount(t)}${attCount(t) ? ` · ${attCount(t)} media` : ''}</td></tr>`).join('') || `<tr><td colspan="7">${emptyState('No tasks match')}</td></tr>`}</tbody></table></div></div>`;
  const v = shell('super_admin', 'tasks', 'Tasks', `${pageHead('Task Management', 'Create tasks for groups or individual volunteers. Field updates appear here instantly.', `<div class="seg" id="vw"><button data-v="board" class="${f.view === 'board' ? 'active' : ''}">${ic('kanban').replace('class="ic ', 'style="width:13px;height:13px;vertical-align:-2px" class="ic ')} Board</button><button data-v="list" class="${f.view === 'list' ? 'active' : ''}">${ic('list').replace('class="ic ', 'style="width:13px;height:13px;vertical-align:-2px" class="ic ')} List</button></div><button class="btn primary" id="newT">${ic('plus')}New task</button>`)}
    <div class="grid g-4 mb-16">${STATUSES.map((s, i) => kpi(s, all.filter(t => t.status === s).length, ['clock', 'refresh', 'check', 'alert'][i], [CH.gray, CH.blue, CH.green, CH.amber][i])).join('')}</div>
    <div class="filters mb-16"><div class="search">${ic('search')}<input class="input" id="q" placeholder="Search tasks" value="${esc(f.q || '')}"></div>${sel('con', conOptions(), f.con, 'id="fc"', 'All constituencies')}${sel('status', STATUSES, f.status, 'id="fs"', 'All statuses')}${sel('pri', PRIORITIES, f.pri, 'id="fp"', 'All priorities')}</div>

  $$('.kcol', v).forEach(col => { col.ondragover = (e) => { e.preventDefault(); col.style.background = '#E2E8F5'; }; col.ondragleave = () => col.style.background = ''; col.ondrop = (e) => { e.preventDefault(); const id = e.dataTransfer.getData('text'); const t = Store.find('tasks', id); if (t && t.status !== col.dataset.col) { API.admin.taskComment(id, '', col.dataset.col); toast(`Moved to ${col.dataset.col}`); } refresh(); }; });
}
function taskForm(pre = {}) {
  const t = pre.id ? Store.find('tasks', pre.id) : null; const d = t || pre;
  const assigned = t ? taskAssignees(t) : [];
  const files = [];

function calendarHTML() {
  const s = UIS.camp; const d = new Date(s.calDate); const posts = Store.t('social_posts').filter(p => p.status !== 'draft');

  let grid = '', title = '';
  if (s.cal === 'month') {
    title = d.toLocaleDateString('en-MY', { month: 'long', year: 'numeric' });
    const first = new Date(d.getFullYear(), d.getMonth(), 1); const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
    grid = `<div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div class="dow">${x}</div>`).join('')}${[...Array(42)].map((_, i) => { const day = new Date(start); day.setDate(start.getDate() + i); const e = evs(day); return `<div class="day ${day.getMonth() !== d.getMonth() ? 'other' : ''} ${isoDate(day) === isoDate(Date.now()) ? 'today' : ''}"><span class="dnum">${day.getDate()}</span>${e.slice(0, 3).map(ev).join('')}${e.length > 3 ? `<span class="tiny muted">+${e.length - 3} more</span>` : ''}</div>`; }).join('')}</div>`;
  } else if (s.cal === 'week') {
    const start = new Date(d); start.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const days = [...Array(7)].map((_, i) => { const x = new Date(start); x.setDate(start.getDate() + i); return x; });
    title = `${fmt.dshort(days[0])} to ${fmt.date(days[6])}`;
    grid = `<div class="week">${days.map(day => `<div class="wday" style="${isoDate(day) === isoDate(Date.now()) ? 'border-color:var(--navy)' : ''}"><div class="small b mb-8">${day.toLocaleDateString('en-MY', { weekday: 'short', day: 'numeric' })}</div><div class="col gap-4">${evs(day).map(ev).join('') || '<span class="tiny muted">No posts</span>'}</div></div>`).join('')}</div>`;
  } else {
    title = d.toLocaleDateString('en-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const e = evs(d);
    grid = `<div class="card">${[...Array(15)].map((_, i) => { const h = i + 7; const he = e.filter(p => new Date(p.published_at || p.scheduled_at).getHours() === h); return `<div class="row" style="border-bottom:1px solid var(--line-2);padding:8px 14px;min-height:44px;align-items:flex-start"><span class="tiny muted" style="width:54px">${h % 12 || 12}:00 ${h < 12 ? 'am' : 'pm'}</span><div class="col gap-4" style="flex:1">${he.map(ev).join('')}</div></div>`; }).join('')}</div>`;
  }
  return `<div class="row mb-12"><div class="row gap-4"><button class="btn sm icon-btn" id="cprev">${ic('chevL')}</button><button class="btn sm" id="ctoday">Today</button><button class="btn sm icon-btn" id="cnext">${ic('chevR')}</button></div><h3 style="margin-left:8px">${title}</h3><span class="spacer"></span><div class="legend"><span><i style="background:var(--green)"></i>Published</span><span><i style="background:var(--amber)"></i>Scheduled</span></div><div class="seg" id="cview">${['month', 'week', 'day'].map(k => `<button data-c="${k}" class="${s.cal === k ? 'active' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div></div>${grid}`;
}
function bindCalendar(v) {
  const s = UIS.camp; const step = (dir) => { const d = new Date(s.calDate); if (s.cal === 'month') d.setMonth(d.getMonth() + dir); else d.setDate(d.getDate() + (s.cal === 'week' ? 7 : 1) * dir); s.calDate = d.getTime(); refresh(); };

  $$('#cview button', v).forEach(b => b.onclick = () => { s.cal = b.dataset.c; refresh(); });
  $$('[data-post]', v).forEach(el => el.onclick = () => { const p = Store.find('social_posts', el.dataset.post); modal({ title: p.status === 'published' ? 'Published post' : 'Scheduled post', size: 'narrow', body: `<div class="post-prev"><div class="row mb-8">${p.account_ids.map(a => plat(Store.find('social_accounts', a).platform)).join('')}<span class="spacer"></span>${badge(p.status)}</div><p>${esc(p.content)}</p><div class="tiny muted mt-8">${fmt.dt(p.published_at || p.scheduled_at)} · ${esc(Store.find('campaigns', p.campaign_id)?.name || '')}</div></div>`, foot: p.status === 'scheduled' ? `<button class="btn primary" id="pn">Publish now</button>` : '<button class="btn" data-close>Close</button>', onMount: (r, close) => { if ($('#pn', r)) $('#pn', r).onclick = async () => { await API.admin.publishNow(p.id); close(); toast('Published'); refresh(); }; } }); });

const aiMsg = (m) => `<div class="msg ai">${m.notice ? `<div class="callout warn mb-8">${esc(m.notice)}</div>` : ''}${m.html}<div class="src">${ic('info').replace('class="ic ', 'style="width:11px;height:11px;vertical-align:-1px" class="ic ')} ${m.src || ''}</div><div class="row mt-8"><button class="btn xs ghost" data-copyai>${ic('copy')}Copy</button></div></div>`;
function bindAIChat(v, scope, ctxFn) {
  const log = $('#clog', v); log.scrollTop = log.scrollHeight;
  const send = async (q) => {
    if (!q.trim()) return; CHATLOG[scope].push({ role: 'user', text: q });
    if (CHATLOG[scope].length === 1) log.innerHTML = '';
    log.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(q)}</div><div class="msg ai typing" id="typ"><span></span><span></span><span></span></div>`); log.scrollTop = log.scrollHeight; $('#cin', v).value = '';

  };
  const bindCopy = () => $$('[data-copyai]', log).forEach(b => b.onclick = () => { const t = b.closest('.msg').innerText.replace(/Copy$/, '').trim(); navigator.clipboard?.writeText(t).then(() => toast('Copied'), () => { }); });

function runSecurityChecks() {
  const saved = sessionStorage.getItem(SESSION_KEY); const out = [];
  const as = (uid) => sessionStorage.setItem(SESSION_KEY, JSON.stringify({ user_id: uid, role: Store.find('users', uid).role }));
  const expectDeny = (role, name, fn) => { try { fn(); out.push({ role, name, pass: false, detail: 'call succeeded' }); } catch (e) { out.push({ role, name, pass: e instanceof Forbidden, detail: e.message }); } };
  const expectOk = (role, name, fn) => { try { const r = fn(); out.push({ role, name, pass: true, detail: typeof r === 'string' ? r : 'allowed' }); } catch (e) { out.push({ role, name, pass: false, detail: e.message }); } };
  try {
    const vol = Store.t('users').find(u => u.role === 'volunteer' && u.active); as(vol.id);
    const mine = API.volunteer.tasks(); const other = Store.t('tasks').find(t => !volTaskIds(vol.volunteer_id).has(t.id));
    expectOk('Volunteer', 'Sees only tasks assigned to them or their group', () => `${mine.length} visible of ${Store.t('tasks').length}`);
    expectDeny('Volunteer', 'Open a task assigned to someone else', () => API.volunteer.task(other.id));
    expectDeny('Volunteer', 'Update a task assigned to someone else', () => API.volunteer.update(other.id, { status: 'Completed' }));
    expectDeny('Volunteer', 'Delete a task', () => API.volunteer.deleteTask());
    expectDeny('Volunteer', 'Change task assignments', () => API.volunteer.reassign());
    expectDeny('Volunteer', 'Call admin API (dashboard stats)', () => API.admin.stats());
    expectDeny('Volunteer', 'Read candidate feedback', () => API.candidate.feedback());
    expectOk('Volunteer', 'Task view hides other volunteers\' contact details', () => { const t = API.volunteer.task(mine[0].id); const leak = JSON.stringify(t).match(/\+60 1\d-\d{3} \d{4}/); if (leak) throw new Error('phone number leaked'); return 'no phone/email in payload'; });
    const cu = Store.t('users').find(u => u.role === 'candidate'); as(cu.id); const myCon = Store.find('candidates', cu.candidate_id).constituency_id;
    const foreign = Store.t('public_feedback').find(f => f.constituency_id !== myCon);
    expectOk('Candidate', 'Sees only own constituency feedback', () => { const fb = API.candidate.feedback(); if (fb.some(f => f.constituency_id !== myCon)) throw new Error('foreign rows'); return `${fb.length} rows, all ${geo.conName(myCon)}`; });
    expectDeny('Candidate', 'Change status of another constituency\'s feedback', () => API.candidate.setStatus(foreign.id, 'Closed'));
    expectDeny('Candidate', 'Create a candidate (admin only)', () => API.admin.saveCandidate({ name: 'x' }));
    expectDeny('Candidate', 'Access volunteer tasks API', () => API.volunteer.tasks());
    sessionStorage.removeItem(SESSION_KEY);
    expectOk('Public', 'Microsite payload has no private fields', () => { const m = API.public.microsite(Store.t('candidates')[0].slug); if ('user_id' in m || 'id' in m) throw new Error('internal ids exposed'); return 'profile fields only'; });
    expectOk('Public', 'Feedback tracking returns status only (no text or contact)', () => { const t = API.public.track(Store.t('public_feedback')[0].ref); if (t.description || t.contact || t.name) throw new Error('leak'); return 'ref, status, dates'; });
    expectDeny('Public', 'Call admin API without signing in', () => API.admin.feedback());
    expectDeny('Public', 'Read candidate feedback without signing in', () => API.candidate.feedback());
  } finally { if (saved) sessionStorage.setItem(SESSION_KEY, saved); else sessionStorage.removeItem(SESSION_KEY); }
  return out;
}

function weeklyCounts(rows, weeks = 8, pred = () => true) { return [...Array(weeks)].map((_, i) => { const end = Date.now() - (weeks - 1 - i) * 7 * 864e5, start = end - 7 * 864e5; return rows.filter(r => pred(r) && new Date(r.created_at) > start && new Date(r.created_at) <= end).length; }); }
const weekLabels = (n = 8) => [...Array(n)].map((_, i) => fmt.dshort(Date.now() - (n - 1 - i) * 7 * 864e5));
const STOP = new Set('the a an of to in on at for and or is are was were be has have had with near our my we i it this that from by as not no please there any can more very after before along been about'.split(' '));
function recurring(rows) {
  const m = {}; rows.forEach(r => { const words = new Set((r.subject + ' ' + r.description).toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(w => w.length > 3 && !STOP.has(w))); words.forEach(w => (m[w] = m[w] || []).push(r)); });
  return Object.entries(m).filter(([, rs]) => rs.length >= 2).sort((a, b) => b[1].length - a[1].length).slice(0, 10);
}

    <form id="lf" class="col mt-24">${field('Email', inp('email', '', 'type="email" autocomplete="username" placeholder="you@metgabb.demo"'))}${field('Password', '<input class="input" type="password" name="password" autocomplete="current-password" placeholder="••••••••">')}<button type="submit" class="btn primary lg block">Sign in</button></form>
    <div class="row mt-24 mb-8"><span class="small b muted">DEMO ACCOUNTS</span><span class="spacer"></span><span class="tiny muted">click to sign in</span></div>
    <div class="col" style="gap:8px">${DEMO_ACCOUNTS.map(([r, e, p, n, d, cls]) => `<button class="demo-acc" data-e="${e}" data-p="${p}">${avatar(n, { size: 'sm' })}<div style="flex:1;min-width:0"><div class="small b">${esc(n)}</div><div class="tiny muted">${esc(d)}</div></div><span class="role-pill ${cls}">${r === 'super_admin' ? 'Admin' : r}</span></button>`).join('')}</div>
    <div class="row mt-24"><a href="#/" class="small">${ic('globe').replace('class="ic ', 'style="width:13px;height:13px;vertical-align:-2px" class="ic ')} Browse public candidate microsites (no login)</a></div></div></div></div>`;
  const go = (email, pw) => { try { const u = Auth.login(email, pw); const next = sessionStorage.getItem('mse_next'); sessionStorage.removeItem('mse_next'); toast(`Signed in as ${esc(u.name)}`); Router.go(next && ((u.role === 'super_admin' && next.startsWith('#/admin')) || (u.role === 'candidate' && next.startsWith('#/cp')) || (u.role === 'volunteer' && next.startsWith('#/vp'))) ? next : Auth.home(u)); } catch (e) { handleErr(e, $('#lf')); } };
  $('#lf').onsubmit = (e) => { e.preventDefault(); const fd = formData($('#lf')); go(fd.email, fd.password); };
  $$('[data-e]').forEach(b => b.onclick = () => { $('[name=email]').value = b.dataset.e; $('[name=password]').value = b.dataset.p; go(b.dataset.e, b.dataset.p); });
}
