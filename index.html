<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1F44">
<title>Metgabb Smart Elections</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1F44'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='17' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{
  --navy:#0B1F44; --navy-2:#132B5E; --blue:#2448B8; --blue-50:#EEF2FF; --blue-100:#DCE4FB;
  --teal:#0E9F9A; --teal-50:#E6F6F5; --amber:#D98B06; --amber-50:#FDF4E3; --rose:#D23B5B; --rose-50:#FCEBEF;
  --green:#15925E; --green-50:#E7F5EE; --violet:#6D4BD8; --violet-50:#F0ECFC;
  --bg:#F5F6FA; --card:#FFFFFF; --line:#E5E8F0; --line-2:#EEF0F5; --text:#0E1730; --muted:#667085; --muted-2:#98A2B3;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06); --shadow-lg:0 12px 32px rgba(11,31,68,.14);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
svg.ic{width:16px;height:16px;flex-shrink:0}
.upl svg{width:22px;height:22px}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px} h4{font-size:13px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px} .b{font-weight:600} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1} .gap-4{gap:4px}.gap-6{gap:6px}.gap-16{gap:16px} .mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}.g-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-21{grid-template-columns:2fr 1fr}.g-12{grid-template-columns:1fr 2fr}
@media(max-width:1100px){.g-5{grid-template-columns:repeat(3,1fr)}.g-4{grid-template-columns:repeat(2,1fr)}.g-21,.g-12{grid-template-columns:1fr}}
@media(max-width:720px){.g-2,.g-3,.g-4,.g-5{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.g-2,.g-3{grid-template-columns:1fr}}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:var(--navy);color:#C9D3EA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;color:#fff}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3B6CF6,#0E9F9A);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;letter-spacing:-.04em}
.brand-name{font-weight:700;font-size:14.5px;line-height:1.1} .brand-sub{font-size:11px;color:#8FA0C6;letter-spacing:.06em;text-transform:uppercase}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6F82AE;padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8.5px 10px;border-radius:9px;color:#C9D3EA;font-weight:500;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);text-decoration:none;color:#fff}
.nav a.active{background:rgba(92,130,255,.18);color:#fff}
.nav a .ic{width:18px;height:18px;opacity:.85;flex-shrink:0}
.nav a .count{margin-left:auto;background:#E0475F;color:#fff;font-size:10.5px;padding:1px 6px;border-radius:10px;font-weight:700}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.05)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar .crumbs{font-size:13px;color:var(--muted)} .topbar .crumbs b{color:var(--text);font-weight:600}
.content{padding:24px;max-width:1440px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px}
.menu-btn{display:none}
@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;z-index:60;transition:left .2s}
  .sidebar.open{left:0;box-shadow:var(--shadow-lg)}
  .menu-btn{display:inline-flex}
  .content{padding:16px}
  .topbar{padding:0 14px}
}
.scrim{position:fixed;inset:0;background:rgba(9,18,40,.45);z-index:55}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:14px}
.card-body{padding:16px 18px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .value{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .delta{font-size:11.5px;color:var(--muted)}
.kpi .kic{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.kpi .kic svg{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:550;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--text)}
.btn:hover{background:#F8F9FC;text-decoration:none}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff} .btn.primary:hover{background:var(--navy-2)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--rose);border-color:#F3C6D0} .btn.danger:hover{background:var(--rose-50)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:#EEF0F5}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px}
.btn.lg{height:44px;padding:0 18px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;padding:0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#F0F2F7;color:#475467}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-blue{background:var(--blue-50);color:var(--blue)} .b-teal{background:var(--teal-50);color:var(--teal)} .b-amber{background:var(--amber-50);color:#A86A00}
.b-rose{background:var(--rose-50);color:var(--rose)} .b-green{background:var(--green-50);color:var(--green)} .b-violet{background:var(--violet-50);color:var(--violet)} .b-gray{background:#F0F2F7;color:#475467}
.b-navy{background:var(--navy);color:#fff}
.mock-flag{display:inline-flex;align-items:center;gap:6px;background:#FFF7E0;color:#8A5A00;border:1px solid #F5DFA6;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 12px;border:none;background:none;cursor:pointer;font-weight:550;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--navy);border-bottom-color:var(--navy)}
.seg{display:inline-flex;background:#EEF0F5;border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:550;font-size:12.5px;color:var(--muted)}
.seg button.active{background:#fff;color:var(--text);box-shadow:var(--shadow)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:#344054}
.field .hint{font-size:11.5px;color:var(--muted)}
.input,.select,.textarea{width:100%;border:1px solid #D7DCE6;background:#fff;border-radius:9px;padding:8px 11px;outline:none;transition:border-color .12s, box-shadow .12s;font-size:13.5px}
.input,.select{height:38px}
.textarea{min-height:90px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,72,184,.12)}
.input.err,.select.err,.textarea.err{border-color:var(--rose);box-shadow:0 0 0 3px rgba(210,59,91,.1)}
.err-text{color:var(--rose);font-size:11.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .select,.filters .input{height:34px;width:auto;min-width:140px;font-size:13px}
.search{position:relative}.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted-2)}
.search .input{padding-left:32px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch{position:relative;width:36px;height:20px;background:#D0D5DD;border-radius:20px;cursor:pointer;transition:.15s;flex-shrink:0;border:none;padding:0}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--green)} .switch.on::after{left:18px}

/* tables */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#F8FAFF}
.empty{padding:36px;text-align:center;color:var(--muted)}

/* avatars */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex-shrink:0;overflow:hidden;background:#7A8BB5}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:26px;height:26px;font-size:10.5px} .av.lg{width:56px;height:56px;font-size:18px} .av.xl{width:120px;height:120px;font-size:38px}
.stack{display:flex}.stack .av{border:2px solid #fff;margin-left:-8px}.stack .av:first-child{margin-left:0}

/* modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(9,18,40,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;animation:fade .12s}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);animation:pop .15s}
.modal.wide{max-width:920px}.modal.narrow{max-width:440px}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.modal-body{padding:20px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-2);background:#FAFBFC;border-radius:0 0 16px 16px}
.drawer-ov{position:fixed;inset:0;background:rgba(9,18,40,.4);z-index:90}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;z-index:91;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .18s}
.drawer .modal-body{overflow:auto;flex:1}
@keyframes fade{from{opacity:0}to{opacity:1}} @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}} @keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:11px 15px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;animation:pop .15s;display:flex;gap:8px;align-items:flex-start}
.toast.err{background:#9E1C3A}
@media(max-width:600px){.toasts{left:12px;right:12px;bottom:80px}}

/* charts */
.chart{width:100%;display:block}
.chart text{font-family:var(--font);fill:#667085;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bar-row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:10px;font-size:12.5px;padding:4px 0}
.bar-track{height:9px;background:#EEF1F6;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;z-index:300;box-shadow:var(--shadow-lg);white-space:nowrap}

/* timeline */
.timeline{display:flex;flex-direction:column;gap:14px}
.tl-item{display:flex;gap:12px}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--blue-50);color:var(--blue)}
.tl-dot svg{width:14px;height:14px}
.tl-body{flex:1;min-width:0}
.media-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.media-thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;background:#EEF1F6}
.media-file{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px;background:#FAFBFC}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{background:#EEF1F6;border-radius:12px;padding:10px;min-height:200px}
.kcol-head{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:650;font-size:13px}
.kcard{background:#fff;border-radius:10px;padding:11px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.kcard:hover{border-color:#B9C5E8}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
.cal .dow{background:#FAFBFC;padding:8px;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center}
.cal .day{background:#fff;min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;gap:4px}
.cal .day.other{background:#FAFBFC;color:var(--muted-2)}
.cal .day.today .dnum{background:var(--navy);color:#fff}
.dnum{font-size:11.5px;font-weight:600;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.cal-ev{font-size:11px;padding:3px 6px;border-radius:6px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:550}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.week .wday{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:280px;padding:10px}
@media(max-width:800px){.week{grid-template-columns:1fr}.cal .day{min-height:70px}}

/* AI chat */
.chat{display:flex;flex-direction:column;height:560px}
.chat-log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:#FBFCFE}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 4px}
.msg.ai h4:first-child{margin-top:0}
.msg.ai ul{margin:4px 0;padding-left:18px} .msg.ai li{margin:2px 0}
.msg.ai .src{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted)}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.suggest{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:#344054}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#98A2B3;margin-right:3px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.callout{padding:12px 14px;border-radius:11px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.callout svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.callout.info{background:var(--blue-50);color:#22397F}
.callout.warn{background:#FFF7E0;color:#7A5200}
.callout.ok{background:var(--green-50);color:#0F6B45}

/* tree */
.tree{font-size:13px}
.tree-node{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px}
.tree-node:hover{background:#F3F5FA}
.tree-children{margin-left:16px;border-left:1px dashed #D5DAE5;padding-left:8px}
.tree-node .acts{margin-left:auto;display:none;gap:2px}
.tree-node:hover .acts{display:flex}
.lvl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);font-weight:700}

/* login */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:radial-gradient(1200px 600px at 10% 10%,#1E3F8F 0,#0B1F44 55%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art .big{font-size:36px;font-weight:750;letter-spacing:-.03em;line-height:1.12;max-width:520px}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px;background:#fff}
.login-card{width:100%;max-width:400px}
.demo-acc{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:#fff;width:100%;text-align:left}
.demo-acc:hover{border-color:var(--blue);background:#F8FAFF}
.feat{display:flex;gap:10px;align-items:flex-start;color:#C9D3EA;font-size:13px}
.feat b{color:#fff;display:block;font-size:13.5px}
@media(max-width:900px){.login-wrap{grid-template-columns:1fr}.login-art{display:none}}

/* public microsite */
.pub{background:#fff;min-height:100vh}
.pub-nav{height:58px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:30}
.pub-nav a.nl{color:#344054;font-weight:550;font-size:13.5px}
.urlbar{display:flex;align-items:center;gap:8px;background:#EEF1F6;padding:6px 12px;border-radius:999px;font-size:12px;color:#475467;max-width:100%;overflow:hidden}
.hero{background:linear-gradient(160deg,var(--navy) 0%,#183B85 70%,#1F4BA8 100%);color:#fff;position:relative;overflow:hidden}
.hero-in{max-width:1100px;margin:0 auto;padding:56px 24px 64px;display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center}
.hero .photo{width:200px;height:200px;border-radius:24px;overflow:hidden;border:4px solid rgba(255,255,255,.18);background:#2A4A93;display:grid;place-items:center;font-size:64px;font-weight:800}
.hero .photo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:40px;letter-spacing:-.03em;line-height:1.08}
.hero .const{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.hero .tagline{font-size:17px;color:#D6E0F7;max-width:620px}
.hero-pattern{position:absolute;inset:0;opacity:.08;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:22px 22px}
.pub-sec{max-width:1100px;margin:0 auto;padding:40px 24px}
.pub-sec h2{font-size:24px;letter-spacing:-.02em;margin-bottom:6px}
.pillar{padding:18px;border-radius:14px;border:1px solid var(--line);background:#fff}
.pillar .n{width:30px;height:30px;border-radius:9px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.social a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:#344054;font-weight:550;font-size:13px}
.fb-type{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fb-type button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 6px;cursor:pointer;font-size:12px;font-weight:600;color:#344054;display:flex;flex-direction:column;align-items:center;gap:6px}
.fb-type button svg{width:18px;height:18px;color:var(--blue)}
.fb-type button.active{border-color:var(--navy);background:var(--navy);color:#fff}.fb-type button.active svg{color:#fff}
@media(max-width:760px){.hero-in{grid-template-columns:1fr;padding:36px 20px 44px;text-align:left}.hero .photo{width:120px;height:120px;font-size:40px}.hero h1{font-size:30px}.fb-type{grid-template-columns:repeat(3,1fr)}.pub-nav{padding:0 14px}.pub-sec{padding:28px 18px}}
.pub-foot{background:#0B1F44;color:#9FB0D4;padding:28px 24px;font-size:12.5px}
.ref-box{background:var(--green-50);border:1px solid #BFE6D2;border-radius:16px;padding:28px;text-align:center}
.ref-num{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:700;color:var(--navy);letter-spacing:.04em;background:#fff;display:inline-block;padding:8px 16px;border-radius:10px;border:1px dashed #9CCBB4;margin:10px 0}

/* volunteer (mobile-first) */
.vshell{min-height:100vh;background:var(--bg);padding-bottom:76px}
.vtop{background:var(--navy);color:#fff;padding:16px 18px 54px;position:relative}
.vtop .hello{font-size:20px;font-weight:700}
.vwrap{max-width:560px;margin:0 auto;padding:0 14px}
.vcards{margin-top:-40px;position:relative;z-index:1}
.vstat{background:#fff;border-radius:14px;padding:12px;border:1px solid var(--line);text-align:center;box-shadow:var(--shadow)}
.vstat .n{font-size:22px;font-weight:750}
.vstat .l{font-size:11px;color:var(--muted);font-weight:600}
.vtask{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:block;color:inherit;cursor:pointer}
.vtask:hover{text-decoration:none;border-color:#B9C5E8}
.vbottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 10px;z-index:40}
.vbottom a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600;padding:4px 14px;border-radius:10px}
.vbottom a svg{width:21px;height:21px}
.vbottom a.active{color:var(--navy)}
.vbottom a:hover{text-decoration:none}
.status-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.status-pick button{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-weight:650;cursor:pointer;font-size:13px}
.status-pick button.active{border-color:var(--navy);background:var(--blue-50);color:var(--navy)}
.upl{border:1.5px dashed #C5CDDD;border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:12.5px;background:#FAFBFD}
.upl:hover{border-color:var(--blue);color:var(--blue)}
.prog{height:6px;background:#E8ECF3;border-radius:6px;overflow:hidden}.prog>div{height:100%;background:var(--teal);border-radius:6px}
.pri-high{color:var(--rose)}.pri-med{color:#B07400}.pri-low{color:var(--green)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:grid;place-items:center;cursor:zoom-out}
.lightbox img,.lightbox video{max-width:92vw;max-height:88vh;border-radius:10px}
.qr-box{background:#fff;padding:14px;border-radius:14px;border:1px solid var(--line);display:inline-block}
.qr-box canvas,.qr-box img{display:block}
.divider{height:1px;background:var(--line-2);margin:14px 0}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.role-pill{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.ins-card{border-left:3px solid var(--blue);padding:12px 14px;background:#fff;border-radius:0 10px 10px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.heat td{text-align:center;font-weight:600;font-size:12px}
.post-prev{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.plat{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#fff;font-size:10px;font-weight:800}
@media print{.sidebar,.topbar,.no-print{display:none!important}.content{padding:0}}

@media(max-width:600px){.hide-sm{display:none!important}}

/* =====================================================================
   CORE: Store (shared DB), Auth, Service layer with role guards,
   Social integration adapters, AI service layer.
   In production: Store -> Supabase Postgres, guards -> RLS + API routes.

const STORE_KEY = 'metgabb_mse_v3';
const SESSION_KEY = 'metgabb_mse_session';
const MEDIA = new Map(); // session-only blobs (videos) -> object URLs

const uid = (p) => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const nowISO = () => new Date().toISOString();
const clone = (o) => JSON.parse(JSON.stringify(o));
const slugify = (s) => s.toLowerCase().replace(/^(dr|ir|prof|puan|encik|tuan haji|ms|mr|mrs|datuk|dato'?)\.?\s+/i, m => m.trim().replace(/\.$/, '').replace(/\s+/g, '-') + '-').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const Store = {
  db: null, listeners: new Set(), memOnly: false,
  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { const d = JSON.parse(raw); if (d && d.meta && d.meta.version === 3) { this.db = d; return; } }
    } catch (e) { this.memOnly = true; }
    this.db = Seed.build(); this.save(true);
  },
  save(silent) {
    if (this.memOnly) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.db)); }
    catch (e) {
      // Quota: drop stored media payloads (keep metadata) and retry once
      ['task_attachments', 'feedback_attachments'].forEach(t => this.db[t].forEach(a => { if (a.data && a.kind === 'image' && a.data.length > 60000) a.data = null; }));
      try { localStorage.setItem(STORE_KEY, JSON.stringify(this.db)); } catch (e2) { this.memOnly = true; }
    }
  },
  commit() { this.save(); this.listeners.forEach(fn => fn()); },
  reset() { this.db = Seed.build(); this.save(); },
  t(name) { return this.db[name]; },
  find(name, id) { return this.db[name].find(r => r.id === id); },
};
window.addEventListener('storage', (e) => {
  if (e.key === STORE_KEY && e.newValue) { try { Store.db = JSON.parse(e.newValue); Store.listeners.forEach(fn => fn('remote')); } catch (_) { } }
});

/* ---------------- Auth ---------------- */
class Forbidden extends Error { constructor(m) { super(m || 'You do not have permission to do this.'); this.code = 403; } }
class Invalid extends Error { constructor(m, fields) { super(m); this.code = 422; this.fields = fields || {}; } }

const Auth = {
  session() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return this._mem || null; } },
  user() { const s = this.session(); if (!s) return null; const u = Store.find('users', s.user_id); return u && u.active ? u : null; },
  login(email, pw) {
    const u = Store.t('users').find(x => x.email.toLowerCase() === String(email).trim().toLowerCase());
    if (!u || u.pw !== pw) throw new Invalid('Incorrect email or password.');
    if (!u.active) throw new Invalid('This account is deactivated. Contact your administrator.');
    if (u.role === 'candidate') { const c = Store.find('candidates', u.candidate_id); if (!c || !c.active) throw new Invalid('Your candidate profile is not active yet.'); }
    const s = { user_id: u.id, role: u.role, at: nowISO() };
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { this._mem = s; }
    u.last_login = nowISO(); audit(u.id, 'login', 'user', u.id, `${u.role} signed in`); Store.commit();
    return u;
  },
  logout() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { } this._mem = null; },
  require(...roles) { const u = this.user(); if (!u) throw new Forbidden('Please sign in.'); if (roles.length && !roles.includes(u.role)) throw new Forbidden(); return u; },
  home(u) { return u.role === 'super_admin' ? '#/admin/dashboard' : u.role === 'candidate' ? '#/cp/dashboard' : '#/vp/home'; },
};

function audit(user_id, action, entity, entity_id, detail) {
  Store.t('audit_logs').unshift({ id: uid('aud'), user_id, action, entity, entity_id, detail, at: nowISO() });
  if (Store.t('audit_logs').length > 400) Store.t('audit_logs').length = 400;
}

/* ---------------- Shared helpers ---------------- */
const geo = {
  con: (id) => Store.find('constituencies', id),
  district: (id) => Store.find('districts', id),
  region: (id) => Store.find('regions', id),
  state: (id) => Store.find('states', id),
  chain(conId) { const c = this.con(conId); if (!c) return {}; const d = this.district(c.district_id) || {}; const r = this.region(d.region_id) || {}; const s = this.state(r.state_id) || {}; return { con: c, district: d, region: r, state: s }; },
  conName(id) { const c = this.con(id); return c ? c.name : '—'; },
};
function volTaskIds(volId) {
  const groups = Store.t('volunteer_group_members').filter(m => m.volunteer_id === volId).map(m => m.group_id);
  const direct = Store.t('task_assignments').filter(a => a.volunteer_id === volId).map(a => a.task_id);
  const viaGroup = Store.t('tasks').filter(t => t.group_id && groups.includes(t.group_id)).map(t => t.id);
  return new Set([...direct, ...viaGroup]);
}
function taskAssignees(task) {
  const direct = Store.t('task_assignments').filter(a => a.task_id === task.id).map(a => a.volunteer_id);
  return direct;
}
const STATUSES = ['Not Started', 'In Progress', 'Completed', 'On Hold'];
const FB_STATUSES = ['Received', 'Under Review', 'In Progress', 'Resolved', 'Closed'];
const FB_TYPES = ['General feedback', 'Public complaint', 'Suggestion', 'Local community issue', 'Request for assistance'];
const PRIORITIES = ['High', 'Medium', 'Low'];
function inRange(iso, from, to) { const t = new Date(iso).getTime(); return (!from || t >= new Date(from).getTime()) && (!to || t <= new Date(to).getTime() + 864e5 - 1); }
function conMatches(conId, f) {
  if (!f) return true;
  const ch = geo.chain(conId);
  if (f.constituency && f.constituency !== conId) return false;
  if (f.state && ch.state.id !== f.state) return false;
  if (f.region && ch.region.id !== f.region) return false;
  if (f.candidate) { const c = Store.find('candidates', f.candidate); if (c && c.constituency_id !== conId) return false; }
  return true;
}

/* ---------------- Validation ---------------- */
const V = {
  req(v, n, errs, key) { if (v == null || String(v).trim() === '') errs[key] = `${n} is required.`; },
  email(v, errs, key) { if (v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) errs[key] = 'Enter a valid email address.'; },
  phone(v, errs, key) { if (v && !/^\+?[0-9\s-]{8,16}$/.test(v)) errs[key] = 'Enter a valid phone number.'; },
  max(v, n, errs, key, lim) { if (v && String(v).length > lim) errs[key] = `${n} must be under ${lim} characters.`; },
  done(errs) { if (Object.keys(errs).length) throw new Invalid('Please fix the highlighted fields.', errs); },
};
const clean = (s) => String(s == null ? '' : s).replace(/<[^>]*>/g, '').trim();

/* =====================================================================
   SERVICE LAYER (every read/write goes through here; guards enforced)
   ===================================================================== */
const API = {
  /* ---------- PUBLIC (no login) ---------- */
  public: {
    candidates() {
      return Store.t('candidates').filter(c => c.active && geo.con(c.constituency_id)?.active).map(c => API.public._safe(c));
    },
    _safe(c) {
      const p = Store.t('candidate_profiles').find(x => x.candidate_id === c.id) || {};
      const ch = geo.chain(c.constituency_id);
      return { slug: c.slug, name: c.name, headline: c.headline, color: c.color, photo: c.photo, constituency: ch.con?.name, constituency_id: c.constituency_id, state: ch.state?.name, district: ch.district?.name, bio: p.bio, background: p.background || [], campaign: p.campaign || {}, contact: p.contact || {}, social: p.social || {} };
    },
    microsite(slug) {
      const c = Store.t('candidates').find(x => x.slug === slug);
      if (!c || !c.active) return null;
      return API.public._safe(c);
    },
    submitFeedback(slug, f) {
      const c = Store.t('candidates').find(x => x.slug === slug && x.active);
      if (!c) throw new Invalid('This candidate page is not available.');
      if (f.website) throw new Invalid('Submission blocked by spam protection.'); // honeypot
      const errs = {};
      V.req(f.subject, 'Subject', errs, 'subject'); V.req(f.description, 'Description', errs, 'description'); V.req(f.category, 'Category', errs, 'category'); V.req(f.type, 'Type', errs, 'type');
      V.max(f.subject, 'Subject', errs, 'subject', 120); V.max(f.description, 'Description', errs, 'description', 2000);
      if (f.description && f.description.trim().length < 15) errs.description = 'Please describe the issue in at least 15 characters.';
      if (f.contact && f.contact.includes('@')) V.email(f.contact, errs, 'contact'); else V.phone(f.contact, errs, 'contact');
      if (!f.consent) errs.consent = 'Please acknowledge the privacy notice.';
      if (String(f.captcha).trim() !== String(f.captcha_answer)) errs.captcha = 'Incorrect answer. Please try again.';
      V.done(errs);
      // rate limit: 3 per 10 minutes per browser
      const key = 'mse_rl'; let hist = []; try { hist = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { }
      hist = hist.filter(t => Date.now() - t < 6e5);
      if (hist.length >= 3) throw new Invalid('Too many submissions from this device. Please try again in a few minutes.');
      hist.push(Date.now()); try { localStorage.setItem(key, JSON.stringify(hist)); } catch (e) { }
      const year = new Date().getFullYear();
      const seq = 1040 + Store.t('public_feedback').length;
      const fb = { id: uid('fb'), ref: `MSE-${year}-${String(seq).padStart(5, '0')}`, candidate_id: c.id, constituency_id: f.constituency_id || c.constituency_id, type: f.type, category: f.category, subject: clean(f.subject), description: clean(f.description), name: clean(f.name), contact: clean(f.contact), status: 'Received', follow_up: false, internal_notes: [], consent: true, source: 'microsite', created_at: nowISO(), updated_at: nowISO() };
      Store.t('public_feedback').unshift(fb);
      (f.files || []).forEach(a => Store.t('feedback_attachments').push({ id: uid('fba'), feedback_id: fb.id, kind: a.kind, name: a.name, size: a.size, data: a.data, blob: a.blob || null }));
      Store.t('feedback_status_history').push({ feedback_id: fb.id, from: null, to: 'Received', by: 'public', at: nowISO(), note: 'Submitted via microsite' });
      audit(null, 'create', 'public_feedback', fb.id, `Public submission ${fb.ref} for ${c.name}`);
      Store.commit();
      return { ref: fb.ref, created_at: fb.created_at };
    },
    track(ref) {
      const fb = Store.t('public_feedback').find(x => x.ref.toUpperCase() === String(ref).trim().toUpperCase());
      if (!fb) return null;
      return { ref: fb.ref, status: fb.status, category: fb.category, submitted: fb.created_at, updated: fb.updated_at }; // no content, no contact
    },
  },

  /* ---------- LOOKUPS (any signed-in user; only non-sensitive) ---------- */
  lookups() {
    return { states: Store.t('states'), regions: Store.t('regions'), districts: Store.t('districts'), constituencies: Store.t('constituencies'), categories: Store.t('feedback_categories'), countries: Store.t('countries') };
  },

  /* ---------- ADMIN ---------- */
  admin: {
    _u() { return Auth.require('super_admin'); },
    stats(f = {}) {
      this._u();
      const cons = Store.t('constituencies').filter(c => conMatches(c.id, f));

    // tasks
    saveTask(d) {
      const u = this._u(); const errs = {};

      if (d.group_id) { const g = Store.find('volunteer_groups', d.group_id); if (g && g.constituency_id !== d.constituency_id) errs.group_id = 'Group belongs to a different constituency.'; }

    async savePost(d) {
      const u = this._u(); const errs = {};
      V.req(d.content, 'Post text', errs, 'content'); if (!(d.account_ids || []).length) errs.accounts = 'Choose at least one connected account.';
      if (d.mode === 'schedule') { V.req(d.scheduled_at, 'Schedule time', errs, 'scheduled_at'); if (d.scheduled_at && new Date(d.scheduled_at) < new Date()) errs.scheduled_at = 'Pick a time in the future.'; }
      const accs = (d.account_ids || []).map(id => Store.find('social_accounts', id));
      if (accs.some(a => a && !a.connected)) errs.accounts = 'One of the selected accounts is not connected.';
      accs.forEach(a => { if (a && a.platform === 'threads' && d.content.length > 500) errs.content = 'Threads posts must be 500 characters or fewer.'; if (a && a.platform === 'tiktok' && !(d.media || []).length && d.mode !== 'draft') errs.content = errs.content || 'TikTok requires a video or image attachment.'; });

      const res = await Social.adapter().createPost({ content: d.content, account_ids: d.account_ids, schedule_at: d.mode === 'schedule' ? new Date(d.scheduled_at).toISOString() : null, draft: d.mode === 'draft', media: d.media || [] });
      let p = d.id ? Store.find('social_posts', d.id) : null;
      const row = { campaign_id: d.campaign_id || null, content: clean(d.content), account_ids: d.account_ids, hashtags: (d.content.match(/#[\w]+/g) || []), status: res.status, scheduled_at: res.scheduled_at || null, published_at: res.published_at || null, ext_id: res.id, media: (d.media || []).map(m => ({ name: m.name, kind: m.kind, data: m.data })) };

  /* ---------- CANDIDATE (own constituency + profile only) ---------- */
  candidate: {
    _me() { const u = Auth.require('candidate'); const c = Store.find('candidates', u.candidate_id); if (!c || !c.active) throw new Forbidden('Candidate profile inactive.'); return { u, c }; },
    me() { const { c } = this._me(); return { cand: clone(c), profile: clone(Store.t('candidate_profiles').find(p => p.candidate_id === c.id)), chain: geo.chain(c.constituency_id) }; },
    feedback() { const { c } = this._me(); return Store.t('public_feedback').filter(f => f.candidate_id === c.id || f.constituency_id === c.constituency_id); },
    _own(id) { const { u, c } = this._me(); const f = Store.find('public_feedback', id); if (!f || (f.candidate_id !== c.id && f.constituency_id !== c.constituency_id)) throw new Forbidden('This feedback belongs to another constituency.'); return { u, f }; },
    setStatus(id, status, note) { const { u, f } = this._own(id); if (!FB_STATUSES.includes(status)) throw new Invalid('Unknown status'); const prev = f.status; if (prev === status) return; f.status = status; f.updated_at = nowISO(); Store.t('feedback_status_history').push({ feedback_id: id, from: prev, to: status, by: u.id, at: nowISO(), note: clean(note || '') }); audit(u.id, 'status', 'public_feedback', id, `${prev} -> ${status}`); Store.commit(); },
    addNote(id, text) { const { u, f } = this._own(id); if (!clean(text)) throw new Invalid('Write a note first.', { note: 'Required' }); f.internal_notes.push({ by: u.id, text: clean(text), at: nowISO() }); f.updated_at = nowISO(); audit(u.id, 'note', 'public_feedback', id, ''); Store.commit(); },
    toggleFollow(id) { const { u, f } = this._own(id); f.follow_up = !f.follow_up; audit(u.id, 'follow_up', 'public_feedback', id, String(f.follow_up)); Store.commit(); },
    updateProfile(d) {
      const { u, c } = this._me(); const errs = {}; V.email(d.contact_email, errs, 'contact_email'); V.phone(d.contact_phone, errs, 'contact_phone'); V.req(d.bio, 'Biography', errs, 'bio'); V.done(errs);
      const p = Store.t('candidate_profiles').find(x => x.candidate_id === c.id);
      Object.assign(p, { bio: clean(d.bio), background: d.background.split('\n').map(clean).filter(Boolean), campaign: { ...p.campaign, tagline: clean(d.tagline), priorities: d.priorities.split('\n').map(clean).filter(Boolean), office_hours: clean(d.office_hours) }, contact: { email: clean(d.contact_email), phone: clean(d.contact_phone), office: clean(d.office) }, social: { facebook: clean(d.facebook), instagram: clean(d.instagram), x: clean(d.x), tiktok: clean(d.tiktok) } });
      if (d.headline !== undefined) c.headline = clean(d.headline);
      if (d.photo !== undefined) c.photo = d.photo;
      audit(u.id, 'update', 'candidate_profiles', c.id, 'Candidate updated own profile'); Store.commit();
    },
  },

  /* ---------- VOLUNTEER (assigned tasks + own updates only) ---------- */
  volunteer: {
    _me() { const u = Auth.require('volunteer'); const v = Store.find('volunteers', u.volunteer_id); if (!v || !v.active) throw new Forbidden('Volunteer account inactive.'); return { u, v }; },
    me() { const { v } = this._me(); const groups = Store.t('volunteer_group_members').filter(m => m.volunteer_id === v.id).map(m => Store.find('volunteer_groups', m.group_id)).filter(Boolean); return { vol: clone(v), groups: clone(groups) }; },
    tasks() { const { v } = this._me(); const ids = volTaskIds(v.id); return clone(Store.t('tasks').filter(t => ids.has(t.id))); },
    task(id) {
      const { v } = this._me(); if (!volTaskIds(v.id).has(id)) throw new Forbidden('This task is not assigned to you or your group.');
      const t = Store.find('tasks', id);
      // volunteers see the update feed for the task, but other volunteers' contact details are never returned
      const ups = Store.t('task_updates').filter(x => x.task_id === id).map(x => ({ ...x, author_name: x.volunteer_id ? (Store.find('volunteers', x.volunteer_id)?.name || 'Volunteer') : 'Campaign Admin' }));
      const atts = Store.t('task_attachments').filter(a => a.task_id === id);
      return { task: clone(t), updates: clone(ups), attachments: atts.map(a => ({ ...a })), group: t.group_id ? clone(Store.find('volunteer_groups', t.group_id)) : null };
    },
    update(id, { status, comment, files }) {
      const { u, v } = this._me(); if (!volTaskIds(v.id).has(id)) throw new Forbidden('This task is not assigned to you or your group.');
      const t = Store.find('tasks', id); const errs = {};
      if (status && !STATUSES.includes(status)) errs.status = 'Invalid status.';
      if (!status && !clean(comment) && !(files || []).length) errs.comment = 'Add a comment, photo or status change.';
      V.max(comment, 'Comment', errs, 'comment', 1500); V.done(errs);
      const prev = t.status; const changed = status && status !== prev;
      const up = { id: uid('upd'), task_id: id, volunteer_id: v.id, user_id: u.id, author_role: 'volunteer', status_from: changed ? prev : null, status_to: changed ? status : null, comment: clean(comment), created_at: nowISO() };
      Store.t('task_updates').push(up);
      (files || []).forEach(f => Store.t('task_attachments').push({ id: uid('att'), task_id: id, update_id: up.id, kind: f.kind, name: f.name, size: f.size, data: f.data, blob: f.blob || null, uploaded_by: v.id, created_at: nowISO() }));
      if (changed) t.status = status; t.updated_at = nowISO();
      audit(u.id, 'task_update', 'tasks', id, `${v.name}: ${changed ? prev + ' -> ' + status + '; ' : ''}${clean(comment).slice(0, 60)}`);
      Store.commit();
    },
    // attempts at forbidden actions route here and throw (used in the permissions test panel)
    deleteTask() { this._me(); throw new Forbidden('Volunteers cannot delete tasks.'); },
    reassign() { this._me(); throw new Forbidden('Volunteers cannot change task assignments.'); },
    updateProfile(d) { const { u, v } = this._me(); const errs = {}; V.req(d.phone, 'Phone', errs, 'phone'); V.phone(d.phone, errs, 'phone'); V.done(errs); v.phone = clean(d.phone); v.availability = d.availability; v.skills = (d.skills || '').split(',').map(clean).filter(Boolean); audit(u.id, 'update', 'volunteers', v.id, 'Volunteer updated own profile'); Store.commit(); },
    history() { const { v } = this._me(); return clone(Store.t('task_updates').filter(x => x.volunteer_id === v.id).sort((a, b) => b.created_at.localeCompare(a.created_at))); },
  },
};

/* =====================================================================
   SOCIAL INTEGRATION ADAPTERS
   Reference: Social-API.ai  (https://api.social-api.ai/v1, Bearer sapi_key_...)
   Endpoints used in production: POST /v1/posts (publish | schedule | draft),
   GET /v1/posts, GET /v1/posts/{id} (per-platform delivery + metrics),
   GET /v1/accounts, POST /v1/accounts/connect, GET /v1/media/upload-url,
   GET /v1/inbox/comments/{postId}, webhooks.
   The browser NEVER calls the vendor directly; it calls our own server route
   (/api/social/*) which adds the secret key from server env vars.
   ===================================================================== */
const Social = {
  adapters: {
    mock: {
      label: 'Mock adapter', live: false,
      async createPost({ schedule_at, draft }) {
        await new Promise(r => setTimeout(r, 450));
        const id = 'mock_' + Math.random().toString(36).slice(2, 9);
        if (draft) return { id, status: 'draft' };
        if (schedule_at) return { id, status: 'scheduled', scheduled_at: schedule_at };
        return { id, status: 'published', published_at: nowISO() };
      },
      async health() { return { ok: true, message: 'Mock adapter is active. Posts are simulated and never leave this device.' }; },
    },
    socialApiAi: {
      label: 'Social-API.ai', live: true,
      async _call(method, path, body) {
        // Server route proxies to https://api.social-api.ai/v1 + Authorization: Bearer ${process.env.SOCIAL_API_KEY}
        const r = await fetch('/api/social' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
        if (!r.ok) throw new Error(`Social API proxy returned ${r.status}`);
        return r.json();
      },
      async createPost({ content, account_ids, schedule_at, draft, media }) {
        const res = await this._call('POST', '/posts', { text: content, account_ids, status: draft ? 'draft' : (schedule_at ? 'scheduled' : 'published'), scheduled_at: schedule_at || undefined, media_ids: (media || []).map(m => m.id).filter(Boolean) });
        return { id: res.id, status: res.status, scheduled_at: res.scheduled_at, published_at: res.published_at };
      },
      async health() { try { await this._call('GET', '/accounts'); return { ok: true, message: 'Connected to Social-API.ai through the server proxy.' }; } catch (e) { return { ok: false, message: 'Could not reach the server proxy (/api/social). This offline prototype has no backend, so live mode is unavailable. Switch back to Mock mode.' }; } },
    },
  },
  adapter() { return Store.db.settings.social.mode === 'live' ? this.adapters.socialApiAi : this.adapters.mock; },
};

/* =====================================================================
   AI SERVICE LAYER
   Providers: 'mock' (grounded, rule-based analysis over real records in this
   prototype) and 'claude' (production: server route /api/ai/chat calls the
   Anthropic Messages API with ANTHROPIC_API_KEY from env). Both receive the
   same grounded context and must separate observations from assumptions.
   ===================================================================== */
const AI_SYSTEM_PROMPT = `You are the Metgabb Smart Elections analyst. Answer ONLY from the JSON context provided (aggregate social topic counts and/or public feedback records).
Rules: 1) Separate "Observations (from data)" from "Assumptions & limits". 2) Quote counts and date ranges exactly; never invent statistics.
3) Say clearly when data is missing or too thin. 4) Aggregate only: never profile or infer the political views of any individual.
5) Sentiment from social media is not representative of all voters; say so. 6) Keep a neutral, factual tone suitable for public-service briefing notes.`;

const CAT_SYN = [
  ['Transportation', /transport|bus|lrt|mrt|traffic|commut|road safety|ciq|feeder/i],
  ['Healthcare', /health|clinic|hospital|dialysis|screening|medical/i],
  ['Public infrastructure', /infra|drain|pothole|road|flood|lift|street light|landslide|signal|erosion|underpass/i],
  ['Education', /educat|school|tuition|student/i],
  ['Safety', /safety|crime|theft|snatch|patrol|crossing/i],
  ['Employment', /employ|job|work|hawker|trader|rental|skill/i],
  ['Environment', /environment|river|dump|recycl|clean|smell|tree|shade/i],
];
const TOPIC_SYN = [
  ['Public transportation', /transport|bus|lrt|mrt|traffic|commut|ciq/i], ['Infrastructure', /infra|drain|pothole|road|flood/i], ['Cost of living', /cost|price|living|afford|rental/i],
  ['Healthcare', /health|clinic|hospital/i], ['Education', /educat|school|tuition/i], ['Employment', /employ|job|work/i], ['Local development', /develop|local/i], ['Safety', /safety|crime/i], ['Environment', /environment|river|clean/i],
];
const AI = {
  provider() { return Store.db.settings.ai.provider; },
  async ask(scope, question, ctx) {
    const u = Auth.require(scope === 'admin' ? 'super_admin' : 'candidate');
    await new Promise(r => setTimeout(r, 650 + Math.random() * 500));
    let out;
    if (this.provider() === 'claude') {
      try {
        const r = await fetch('/api/ai/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ system: AI_SYSTEM_PROMPT, question, context: ctx }) });
        if (!r.ok) throw new Error();
        out = await r.json();
      } catch (e) {
        out = scope === 'admin' ? this.adminAnswer(question, ctx) : this.candAnswer(question, ctx);
        out.notice = 'Claude provider selected, but the server route /api/ai/chat is not available in this offline prototype. Showing the grounded mock analysis instead.';
      }
    } else out = scope === 'admin' ? this.adminAnswer(question, ctx) : this.candAnswer(question, ctx);
    Store.t('ai_analysis_history').unshift({ id: uid('aih'), user_id: u.id, role: u.role, question, answer_summary: (out.summary || '').slice(0, 200), provider: this.provider(), created_at: nowISO() });
    Store.commit();
    return out;
  },
  /* ---- grounded analysis over feedback rows (candidate) ---- */
  candAnswer(q, { rows, conName }) {
    const ql = q.toLowerCase(); const DAY = 864e5, now = Date.now();
    let scope = rows, period = 'all time';
    if (/this week|latest|last 7|past week|recent/.test(ql)) { scope = rows.filter(r => now - new Date(r.created_at) < 7 * DAY); period = 'the last 7 days'; }
    else if (/this month|last 30|past month/.test(ql)) { scope = rows.filter(r => now - new Date(r.created_at) < 30 * DAY); period = 'the last 30 days'; }
    const cat = (CAT_SYN.find(([, re]) => re.test(q)) || [])[0];
    if (cat) scope = scope.filter(r => r.category === cat);
    const n = (ql.match(/top\s*(\d+)/) || [])[1] || (/top five/.test(ql) ? 5 : /top three/.test(ql) ? 3 : null);
    const counts = {}; scope.forEach(r => counts[r.category] = (counts[r.category] || 0) + 1);
    const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const open = scope.filter(r => !['Resolved', 'Closed'].includes(r.status));
    const age = r => Math.floor((now - new Date(r.created_at)) / DAY);
    const attention = open.filter(r => r.follow_up || (r.status === 'Received' && age(r) >= 2) || /lift|landslide|flood|unsafe|elderly|dialysis/i.test(r.subject + r.description)).slice(0, 6);
    const li = r => `<li><b>${esc(r.subject)}</b> <span class="muted">(${esc(r.category)}, ${esc(r.status)}, ${age(r)}d old, ${esc(r.ref)})</span></li>`;
    const src = `Based on ${scope.length} of ${rows.length} microsite submissions for ${esc(conName)} (${period}${cat ? `, category: ${cat}` : ''}). Generated ${new Date().toLocaleString()}.`;
    const lim = ['Submissions are self-selected; they show what residents chose to report, not how widespread an issue is.', 'Counts are small, so week-to-week changes may be noise.'];
    if (!scope.length) return { summary: 'No data', html: `<h4>Observations (from data)</h4><p>There are no submissions matching this question (${period}${cat ? `, ${cat}` : ''}). I can't summarise concerns without data.</p><h4>Missing information</h4><p>Try a wider date range or a different category.</p>`, src };
    let html = '';
    if (/brief/.test(ql)) {
      const ex = scope.slice(0, 5);
      html += `<h4>Briefing note: ${esc(cat || 'Public concerns')}, ${esc(conName)}</h4><p><b>Purpose:</b> factual summary of issues raised by residents through the public feedback page.</p>`;
      html += `<h4>Observations (from data)</h4><ul><li>${scope.length} submissions in ${period}; ${open.length} still open, ${scope.length - open.length} resolved or closed.</li>${ranked.slice(0, 3).map(([c, k]) => `<li>${esc(c)}: ${k} submission${k > 1 ? 's' : ''}</li>`).join('')}<li>Most common type: ${esc(mode(scope.map(r => r.type)))}.</li></ul>`;
      html += `<h4>Issues reported</h4><ul>${ex.map(li).join('')}</ul>`;
      html += `<h4>Suggested factual response points</h4><ul><li>Acknowledge each open issue and the agency responsible (council, health office, transport operator) without promising outcomes not yet confirmed.</li><li>Share the status of items already in progress, with reference numbers.</li><li>Invite residents to keep reporting through the feedback page.</li></ul>`;
      html += `<h4>Assumptions & limits</h4><ul>${lim.map(x => `<li>${x}</li>`).join('')}<li>No cost or timeline data is held in this system; confirm with the relevant agency before stating dates.</li></ul>`;
      return { summary: 'Briefing note', html, src };
    }
    if (/attention|urgent|priorit|requir/.test(ql)) {
      html += `<h4>Observations (from data)</h4><p>${open.length} open items. ${attention.length} flagged for attention because they are marked for follow-up, have waited 2+ days without review, or mention safety-critical words (lift, flood, landslide, elderly).</p><ul>${attention.map(li).join('') || '<li>None meet these rules.</li>'}</ul>`;
      html += `<h4>Assumptions & limits</h4><ul><li>"Needs attention" uses simple rules, not a judgement of severity. Please review each item.</li></ul>`;
      return { summary: 'Attention list', html, src };
    }
    if (/emerg|increas|trend|rising|new/.test(ql)) {
      const recent = rows.filter(r => now - new Date(r.created_at) < 14 * DAY), prior = rows.filter(r => { const d = now - new Date(r.created_at); return d >= 14 * DAY && d < 28 * DAY; });
      const cc = a => a.reduce((m, r) => (m[r.category] = (m[r.category] || 0) + 1, m), {});
      const a = cc(recent), b = cc(prior); const cats = [...new Set([...Object.keys(a), ...Object.keys(b)])].map(c => [c, a[c] || 0, b[c] || 0]).sort((x, y) => (y[1] - y[2]) - (x[1] - x[2]));
      html += `<h4>Observations (from data)</h4><p>Last 14 days: ${recent.length} submissions. Previous 14 days: ${prior.length}.</p><ul>${cats.map(([c, x, y]) => `<li>${esc(c)}: ${x} vs ${y} ${x > y ? '<b style="color:var(--rose)">▲ rising</b>' : x < y ? '<span class="muted">▼</span>' : ''}</li>`).join('')}</ul>`;
      html += `<h4>Assumptions & limits</h4><ul>${lim.map(x => `<li>${x}</li>`).join('')}</ul>`;
      return { summary: 'Trend', html, src };
    }
    const top = ranked.slice(0, n ? +n : 5);
    html += `<h4>Observations (from data)</h4><p>${scope.length} submissions in ${period}${cat ? ` about ${esc(cat)}` : ''}. ${open.length} are still open.</p>`;
    if (!cat) html += `<ol>${top.map(([c, k]) => { const ex = scope.filter(r => r.category === c).slice(0, 2).map(r => esc(r.subject)).join('; '); return `<li><b>${esc(c)}</b> (${k}): ${ex}</li>`; }).join('')}</ol>`;
    else html += `<ul>${scope.slice(0, 8).map(li).join('')}</ul><p>Most common type: ${esc(mode(scope.map(r => r.type)))}. Statuses: ${Object.entries(scope.reduce((m, r) => (m[r.status] = (m[r.status] || 0) + 1, m), {})).map(([s, k]) => `${s} ${k}`).join(', ')}.</p>`;
    html += `<h4>Assumptions & limits</h4><ul>${lim.map(x => `<li>${x}</li>`).join('')}</ul>`;
    return { summary: 'Summary', html, src };
  },
  /* ---- grounded analysis over aggregate social data + feedback (admin) ---- */
  adminAnswer(q, { agg, fb, conNames }) {
    const ql = q.toLowerCase();
    const topic = (TOPIC_SYN.find(([, re]) => re.test(q)) || [])[0];
    const maxW = Math.max(...agg.map(a => a.week_index));
    const sum = (rows, k = 'mentions') => rows.reduce((s, r) => s + r[k], 0);
    const byTopic = {}; agg.forEach(a => { (byTopic[a.topic] = byTopic[a.topic] || []).push(a); });
    const total = sum(agg);
    const src = `Based on ${total.toLocaleString()} aggregated public mentions (mock connected sources, 8 weeks) and ${fb.length} microsite submissions across ${conNames.length} constituencies: ${conNames.slice(0, 6).join(', ')}${conNames.length > 6 ? '…' : ''}.`;
    const lim = ['Social media mentions reflect people who post publicly; they are not representative of all voters.', 'Sentiment is estimated per post by a classifier and aggregated; individual-level data is not stored or profiled.', 'Mock data in this prototype; connect live sources for real figures.'];
    let html = '';
    if (/increas|rising|emerg|this month|grow/.test(ql)) {
      const rows = Object.entries(byTopic).map(([t, r]) => { const recent = sum(r.filter(x => x.week_index > maxW - 4)), prev = sum(r.filter(x => x.week_index <= maxW - 4)); return [t, recent, prev, prev ? (recent - prev) / prev * 100 : 0]; }).sort((a, b) => b[3] - a[3]);
      html += `<h4>Observations (from data)</h4><p>Comparing the last 4 weeks with the 4 weeks before:</p><ul>${rows.slice(0, 5).map(([t, r, p, pct]) => `<li><b>${esc(t)}</b>: ${r.toLocaleString()} vs ${p.toLocaleString()} mentions (${pct >= 0 ? '+' : ''}${pct.toFixed(0)}%)</li>`).join('')}</ul>`;
      const fbRecent = fb.filter(f => Date.now() - new Date(f.created_at) < 30 * 864e5);
      html += `<p>Microsite submissions in the last 30 days: ${fbRecent.length}, led by ${esc(mode(fbRecent.map(f => f.category)) || 'n/a')}.</p>`;
      html += `<h4>Assumptions & limits</h4><ul>${lim.map(x => `<li>${x}</li>`).join('')}</ul>`;
      return { summary: 'Rising topics', html, src };
    }
    if (topic) {
      const r = byTopic[topic] || [];
      const tot = sum(r), neg = sum(r, 'negative'), pos = sum(r, 'positive');
      const byCon = {}; r.forEach(x => byCon[x.constituency_id] = (byCon[x.constituency_id] || 0) + x.mentions);
      const fbCat = { 'Public transportation': 'Transportation', Infrastructure: 'Public infrastructure' }[topic] || topic;
      const fbr = fb.filter(f => f.category === fbCat);
      html += `<h4>Observations (from data)</h4><ul><li>${tot.toLocaleString()} public mentions of ${esc(topic)} over 8 weeks; ${Math.round(neg / tot * 100)}% negative, ${Math.round(pos / tot * 100)}% positive.</li><li>Most discussed in: ${Object.entries(byCon).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, k]) => `${esc(geo.conName(c))} (${k})`).join(', ')}.</li><li>${fbr.length} related microsite submissions${fbr.length ? `, e.g. ${fbr.slice(0, 3).map(f => `"${esc(f.subject)}"`).join(', ')}` : ''}.</li></ul>`;
      if (fbr.length) html += `<h4>Topics that may need a factual public response</h4><ul>${fbr.filter(f => !['Resolved', 'Closed'].includes(f.status)).slice(0, 3).map(f => `<li>${esc(f.subject)} (${esc(geo.conName(f.constituency_id))}, ${esc(f.status)})</li>`).join('')}</ul>`;
      html += `<h4>Assumptions & limits</h4><ul>${lim.map(x => `<li>${x}</li>`).join('')}</ul>`;
      return { summary: topic, html, src };
    }
    // summary across constituencies
    const ranked = Object.entries(byTopic).map(([t, r]) => [t, sum(r), sum(r, 'negative')]).sort((a, b) => b[1] - a[1]);
    html += `<h4>Observations (from data)</h4><ol>${ranked.slice(0, 5).map(([t, m, n]) => `<li><b>${esc(t)}</b>: ${m.toLocaleString()} mentions, ${Math.round(n / m * 100)}% negative</li>`).join('')}</ol>`;
    const perCon = {}; agg.forEach(a => { perCon[a.constituency_id] = perCon[a.constituency_id] || {}; perCon[a.constituency_id][a.topic] = (perCon[a.constituency_id][a.topic] || 0) + a.mentions; });
    html += `<h4>By constituency (top issue)</h4><ul>${Object.entries(perCon).map(([c, t]) => { const top = Object.entries(t).sort((a, b) => b[1] - a[1])[0]; return `<li>${esc(geo.conName(c))}: ${esc(top[0])} (${top[1]})</li>`; }).join('')}</ul>`;
    html += `<h4>Assumptions & limits</h4><ul>${lim.map(x => `<li>${x}</li>`).join('')}</ul>`;
    return { summary: 'Overview', html, src };
  },
};
function mode(arr) { const m = {}; arr.forEach(x => m[x] = (m[x] || 0) + 1); return (Object.entries(m).sort((a, b) => b[1] - a[1])[0] || [''])[0]; }

/* =====================================================================
   UI KIT: helpers, icons, charts, modal/drawer/toast, uploads, QR, router
   ===================================================================== */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const fmt = {
  date: (d) => d ? new Date(d).toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' }) : '—',
  dshort: (d) => d ? new Date(d).toLocaleDateString('en-MY', { day: 'numeric', month: 'short' }) : '—',
  dt: (d) => d ? new Date(d).toLocaleString('en-MY', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '—',
  num: (n) => (n || 0).toLocaleString('en-MY'),
  k: (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n),
  ago(d) { const s = (Date.now() - new Date(d)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 86400 * 30) return Math.floor(s / 86400) + 'd ago'; return fmt.date(d); },
  due(d) { const days = Math.ceil((new Date(d) - Date.now()) / 864e5); if (days < 0) return `<span style="color:var(--rose)">Overdue ${-days}d</span>`; if (days === 0) return '<span style="color:var(--amber)">Due today</span>'; if (days === 1) return 'Due tomorrow'; return `Due in ${days}d`; },
  size: (b) => b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB',
};
const isoDate = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };

  const render = () => { prev.innerHTML = store.map((f, i) => `<div style="position:relative">${f.kind === 'image' ? `<img class="media-thumb" src="${f.data}">` : `<span class="media-file">${ic('video')}${esc(f.name)}</span>`}<button type="button" class="btn xs" style="position:absolute;top:-6px;right:-6px;border-radius:50%;width:22px;padding:0" data-rm="${i}">×</button></div>`).join(''); $$('[data-rm]', prev).forEach(b => b.onclick = () => { store.splice(+b.dataset.rm, 1); render(); }); $$('svg', prev).forEach(s => s.style.cssText = 'width:14px;height:14px'); };
  input.onchange = async () => { const files = await readFiles(input.files, allowed); store.push(...files); input.value = ''; render(); };
}

/* ---------- QR code ---------- */
function qrCanvas(text, { scale = 8, margin = 4, label, sub, color = '#0B1F44' } = {}) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(); const size = (n + margin * 2) * scale; const extra = label ? 70 : 0;
  const c = document.createElement('canvas'); c.width = size; c.height = size + extra; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = color;
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect((k + margin) * scale, (r + margin) * scale, scale, scale);
  if (label) { g.fillStyle = '#0B1F44'; g.font = `bold ${Math.round(scale * 2.1)}px Arial`; g.textAlign = 'center'; g.fillText(label, size / 2, size + 22); g.fillStyle = '#667085'; g.font = `${Math.round(scale * 1.6)}px Arial`; g.fillText(sub || '', size / 2, size + 48); }
  return c;
}
function downloadCanvas(c, name) { const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function downloadText(text, name, type = 'text/csv') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
const toCSV = (rows) => { if (!rows.length) return ''; const keys = Object.keys(rows[0]); const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`; return [keys.join(','), ...rows.map(r => keys.map(k => q(r[k])).join(','))].join('\n'); };

const CH = { blue: '#2448B8', teal: '#0E9F9A', amber: '#E0A21B', rose: '#D23B5B', violet: '#6D4BD8', green: '#15925E', navy: '#0B1F44', sky: '#5B8DEF', gray: '#98A2B3' };
const SERIES = [CH.blue, CH.teal, CH.amber, CH.violet, CH.rose, CH.green, CH.sky, '#B04BC5', CH.gray];
const Charts = {
  donut(data, { size = 168, thick = 22, center, centerSub } = {}) {
    const total = data.reduce((s, d) => s + d.value, 0) || 1; const r = (size - thick) / 2, cx = size / 2, C = 2 * Math.PI * r; let off = 0;
    const arcs = data.map(d => { const len = d.value / total * C; const a = `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${thick}" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})" data-tip="${esc(d.label)}: <b>${fmt.num(d.value)}</b> (${Math.round(d.value / total * 100)}%)" style="cursor:pointer"/>`; off += len; return a; }).join('');
    return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-width:${size}px"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#EEF1F6" stroke-width="${thick}"/>${arcs}${center != null ? `<text x="${cx}" y="${cx + 2}" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#0E1730">${center}</text><text x="${cx}" y="${cx + 20}" text-anchor="middle" style="font-size:11px">${centerSub || ''}</text>` : ''}</svg>`;
  },
  legend(data) { return `<div class="legend">${data.map(d => `<span><i style="background:${d.color}"></i>${esc(d.label)} <b style="color:var(--text)">${fmt.num(d.value)}</b></span>`).join('')}</div>`; },
  bars(data, { color = CH.blue, max, suffix = '' } = {}) {
    const m = max || Math.max(1, ...data.map(d => d.value));
    return data.map(d => `<div class="bar-row" data-tip="${esc(d.label)}: <b>${fmt.num(d.value)}${suffix}</b>"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${d.value / m * 100}%;background:${d.color || color}"></div></div><b style="text-align:right">${fmt.num(d.value)}${suffix}</b></div>`).join('');
  },
  line(series, labels, { h = 220, area = true, yfmt = fmt.k, w = 640 } = {}) {
    const W = w, H = h, pl = 40, pr = 12, pt = 14, pb = 26; const all = series.flatMap(s => s.values); const max = Math.max(1, ...all) * 1.1;
    const x = i => pl + (labels.length < 2 ? 0 : i * (W - pl - pr) / (labels.length - 1)); const y = v => pt + (H - pt - pb) * (1 - v / max);
    let lastLbl = null; const grid = [0, .25, .5, .75, 1].map(f => { const lb = yfmt(Math.round(max * f)); const show = lb !== lastLbl; lastLbl = lb; return `<line x1="${pl}" x2="${W - pr}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#EEF1F6"/>${show ? `<text x="${pl - 6}" y="${y(max * f) + 4}" text-anchor="end">${lb}</text>` : ''}`; }).join('');
    const step = Math.ceil(labels.length / 8); const lastOk = (labels.length - 1) % step === 0 || (labels.length - 1) % step > step * .6; const xl = labels.map((l, i) => i % step === 0 || (i === labels.length - 1 && lastOk) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle'}">${esc(l)}</text>` : '').join('');
    const paths = series.map((s, si) => { const pts = s.values.map((v, i) => `${x(i)},${y(v)}`); const col = s.color || SERIES[si]; return `${area ? `<path d="M${pts[0]} L${pts.join(' L')} L${x(s.values.length - 1)},${y(0)} L${x(0)},${y(0)}Z" fill="${col}" opacity=".08"/>` : ''}<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="#fff" stroke="${col}" stroke-width="2" data-tip="${esc(s.name)} · ${esc(labels[i])}: <b>${fmt.num(v)}</b>" style="cursor:pointer"/>`).join('')}`; }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${xl}${paths}</svg>`;
  },
  stacked(labels, series, { h = 220, w = 640 } = {}) {
    const W = w, H = h, pl = 36, pr = 8, pt = 10, pb = 28; const totals = labels.map((_, i) => series.reduce((s, se) => s + se.values[i], 0)); const max = Math.max(1, ...totals) * 1.08;
    const bw = (W - pl - pr) / labels.length * .62; const x = i => pl + (i + .5) * (W - pl - pr) / labels.length - bw / 2; const y = v => pt + (H - pt - pb) * (1 - v / max);
    let out = [0, .5, 1].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#EEF1F6"/><text x="${pl - 6}" y="${y(max * f) + 4}" text-anchor="end">${Math.round(max * f)}</text>`).join('');
    labels.forEach((l, i) => { let acc = 0; series.forEach((se, si) => { const v = se.values[i]; if (!v) return; out += `<rect x="${x(i)}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}" fill="${se.color || SERIES[si]}" rx="2" data-tip="${esc(l)} · ${esc(se.name)}: <b>${v}</b>" style="cursor:pointer"/>`; acc += v; }); out += `<text x="${x(i) + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(l.length > 11 ? l.slice(0, 10) + '…' : l)}</text>`; });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${out}</svg>`;
  },
  spark(values, color = CH.blue) { const W = 90, H = 26, m = Math.max(1, ...values); const pts = values.map((v, i) => `${i * W / (values.length - 1)},${H - 2 - v / m * (H - 4)}`).join(' '); return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8"/></svg>`; },
};
const kpi = (label, value, iconName, col, sub) => `<div class="card kpi"><div class="kic" style="background:${col}1A;color:${col}">${ic(iconName)}</div><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="delta">${sub}</div>` : ''}</div>`;
const card = (title, body, actions = '', pad = true) => `<div class="card">${title ? `<div class="card-head"><h3>${title}</h3><div class="spacer"></div>${actions}</div>` : ''}<div class="${pad ? 'card-body' : ''}">${body}</div></div>`;

const Router = {
  routes: [], add(pattern, handler, role) { this.routes.push({ re: new RegExp('^' + pattern.replace(/:(\w+)/g, '([^/]+)') + '$'), handler, role }); },
  go(h) { if (location.hash === h) this.render(); else location.hash = h; },
  render() {
    const h = location.hash.replace(/^#/, '') || '/';
    $$('body > .mwrap, body > .lightbox, body > .scrim').forEach(x => x.remove());
    for (const r of this.routes) {
      const m = h.match(r.re); if (!m) continue;
      if (r.role) { const u = Auth.user(); if (!u) { sessionStorage.setItem('mse_next', '#' + h); return this.go('#/login'); } if (u.role !== r.role) { toast('Access denied for your role. Redirected to your portal.', 'err'); return this.go(Auth.home(u)); } }
      try { r.handler(...m.slice(1).map(decodeURIComponent)); } catch (e) { if (e instanceof Forbidden) { toast(esc(e.message), 'err'); const u = Auth.user(); this.go(u ? Auth.home(u) : '#/login'); } else { console.error(e); $('#app').innerHTML = `<div class="content">${card('Something went wrong', `<p class="muted">${esc(e.message)}</p>`)}</div>`; } }
      window.scrollTo(0, 0); return;
    }
    this.go('#/');
  },
};
window.addEventListener('hashchange', () => Router.render());

  <div class="grid" style="grid-template-columns:minmax(260px,340px) 1fr;align-items:start" id="cgrid">
    ${card('Hierarchy', `<div class="tree">${tree}</div><div class="callout info mt-12">${ic('info')}<div>The hierarchy is data, not code. Add or rename states, regions and districts here; constituencies attach to a district.</div></div>`)}
    <div class="card"><div class="card-head"><div class="filters"><div class="search">${ic('search')}<input class="input" id="q" placeholder="Search name or ID" value="${esc(f.q || '')}"></div>${sel('state', L.states.map(s => [s.id, s.name]), f.state, 'id="fs"', 'All states')}${sel('status', [['true', 'Active'], ['false', 'Inactive']], f.status, 'id="fst"', 'Any status')}</div><div class="spacer"></div><span class="small muted">${rows.length} of ${L.constituencies.length}</span></div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>Constituency</th><th>Location</th><th>Voters</th><th>Candidate</th><th>Volunteers</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(c => { const ch = geo.chain(c.id); const cand = Store.t('candidates').find(x => x.constituency_id === c.id); return `<tr class="click" data-open="${c.id}"><td><div class="b">${esc(c.name)}</div><div class="mono muted">${esc(c.code)}</div></td><td class="small">${esc(ch.district.name || '')}, ${esc(ch.region.name || '')}<div class="tiny muted">${esc(ch.state.name || '')}</div></td><td>${fmt.num(c.voters)}</td><td class="small">${cand ? esc(cand.name) : '<span class="muted">—</span>'}</td><td>${Store.t('volunteers').filter(x => x.constituency_id === c.id).length}</td><td><button class="switch ${c.active ? 'on' : ''}" data-toggle="${c.id}" data-tip="${c.active ? 'Deactivate' : 'Activate'}"></button></td><td class="row gap-4"><button class="btn xs" data-edit="${c.id}">${ic('edit')}</button><button class="btn xs danger" data-del="${c.id}">${ic('trash')}</button></td></tr>`; }).join('') || `<tr><td colspan="7">${emptyState('No constituencies found')}</td></tr>`}</tbody></table></div></div>
  </div>`);
  if (window.innerWidth < 1000) $('#cgrid', v).style.gridTemplateColumns = '1fr';
  $('#q', v).oninput = (e) => { UIS.con.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(() => { refresh(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); };
  $('#fs', v).onchange = e => { UIS.con.state = e.target.value; refresh(); }; $('#fst', v).onchange = e => { UIS.con.status = e.target.value; refresh(); };

  $$('[data-del]', v).forEach(b => b.onclick = async () => { if (await confirmDlg('Delete constituency?', 'This permanently removes the constituency. Constituencies with linked records must be deactivated instead.', 'Delete')) { try { API.admin.deleteConstituency(b.dataset.del); toast('Constituency deleted'); refresh(); } catch (e) { handleErr(e); } } });
  $$('[data-add]', v).forEach(b => b.onclick = () => nodeForm(b.dataset.add, null, b.dataset.parent));

  $$('[data-ndel]', v).forEach(b => b.onclick = async () => { if (await confirmDlg(`Delete ${b.dataset.lvl}?`, 'Only empty nodes can be deleted.', 'Delete')) { try { API.admin.deleteNode(b.dataset.lvl, b.dataset.ndel); toast('Deleted'); refresh(); } catch (e) { handleErr(e); } } });
}
function nodeActs(level, n, child) { return `${child ? `<button class="btn xs ghost" data-add="${child}" data-parent="${n.id}" data-tip="Add ${child}">${ic('plus')}</button>` : ''}<button class="btn xs ghost" data-nedit="${n.id}" data-lvl="${level}" data-tip="Rename">${ic('edit')}</button><button class="btn xs ghost" data-ndel="${n.id}" data-lvl="${level}" data-tip="Delete">${ic('trash')}</button>`; }
function nodeForm(level, node, parent) {
  modal({ title: `${node ? 'Edit' : 'Add'} ${level}`, size: 'narrow', body: `<form class="col" id="nf">${field('Name', inp('name', node?.name || '', 'autofocus'))}${level === 'state' ? field('Code', inp('code', node?.code || '', 'maxlength="5" placeholder="e.g. PNG"')) : ''}</form>`, foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="sv">Save</button>`, onMount: (r, close) => { $('#sv', r).onclick = () => { try { API.admin.saveNode(level, { ...formData($('#nf', r)), id: node?.id, parent }); close(); toast(`${level[0].toUpperCase() + level.slice(1)} saved`); refresh(); } catch (e) { handleErr(e, $('#nf', r)); } }; } });

function constituencyForm(c) {

function adminVolunteers() {

  const rows = vols.filter(v => (!f.con || v.constituency_id === f.con) && (!f.status || String(v.active) === f.status) && (!f.q || (v.name + v.email + v.phone).toLowerCase().includes(f.q.toLowerCase())));
  const stat = (v) => { const ids = volTaskIds(v.id); const ts = Store.t('tasks').filter(t => ids.has(t.id)); const ups = Store.t('task_updates').filter(u => u.volunteer_id === v.id); return { total: ts.length, done: ts.filter(t => t.status === 'Completed').length, ups: ups.length, last: ups.map(u => u.created_at).sort().pop() }; };
