*{box-sizing:border-box}html,body{margin:0;height:100%}

.go:hover{background:#132B5E}.go:disabled{opacity:.6;cursor:wait}

.foot{margin-top:20px;padding-top:14px;border-top:1px solid #EEF0F5;font-size:11.5px;color:#98A2B3;display:flex;gap:6px;align-items:center}

        $('go').disabled = false; $('go').textContent = 'Unlock'; $('pw').select();
        showGate(Date.now() < waitUntil ? 'Too many attempts. Try again in 30 seconds.' : 'That password is not correct.');
      });
  };
  var saved = store.get();
  if (saved) decrypt(fromB64(saved)).then(open).catch(function () { store.clear(); showGate(); });
  else showGate();
})();
</script>
</body>
</html>
